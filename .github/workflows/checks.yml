name: Research workbench checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      BONE_TEST_STORAGE: var
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - name: Verify real model, predictions and Grad-CAM against original runtime
        run: python scripts/check_runtime.py --bundle downloads/BoneAtlas_MVP_0.2_Python314.zip --storage "${{ env.BONE_TEST_STORAGE }}" --output "${{ runner.temp }}/runtime-check.json"
      - run: python -m unittest discover -s tests -v
      - run: node --check app/static/app.js
      - name: Unpack the current public research model
        run: python -c "from zipfile import ZipFile; ZipFile('downloads/BoneAtlas_MVP_0.3_Training.zip').extractall(r'${{ runner.temp }}/bone-v03')"
      - name: Verify trained ResNet predictions and original-coordinate Grad-CAM on CPU
        run: python scripts/check_runtime.py --storage "${{ runner.temp }}/bone-v03/bone-atlas/var" --output "${{ runner.temp }}/resnet-check.json"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-check-${{ matrix.os }}-py314
          path: |
            ${{ runner.temp }}/runtime-check.json
            ${{ runner.temp }}/resnet-check.json
      # Public bundled fixtures are checked with current checkout code on both OSes.
      # Runtime compatibility does not establish clinical or ML accuracy.
